<style>

.meter.over i{background:var(--warn)}
table{width:100%;border-collapse:collapse;margin-top:14px}
td{padding:12px 4px;border-top:1px solid var(--line);vertical-align:top}

.status{margin:12px 0 4px;font-weight:500}
.status.ok{color:var(--ok)}.status.bad{color:var(--warn)}
.note{color:var(--muted);font-size:.88rem;margin:10px 0 0}
.actions{margin-top:16px}
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}.tabs button{width:auto;padding:7px 14px;background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}.tabs button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
td a{color:var(--accent);text-decoration:none;font-weight:600;margin-left:4px}
[hidden]{display:none!important}
.pcard{width:auto;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);display:flex;flex-direction:column;padding:10px 12px;font-weight:400}.pcard[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}.pl{color:var(--muted);font-size:.8rem}.pn{font-weight:500;font-size:.9rem}
.view3d{position:relative;height:clamp(260px,42vw,380px);border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 50% 35%,var(--soft),var(--bg));margin:0 0 16px;overflow:hidden}.view3d canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}.glb-tools{position:absolute;right:10px;top:10px;z-index:5;display:flex;gap:6px;align-items:center;max-width:calc(100% - 20px)}.glb-tools button{width:auto;padding:7px 10px;font-size:.76rem;border-radius:8px;box-shadow:none}.glb-tools button.ghost{background:rgba(12,14,22,.88);border:1px solid var(--line);color:var(--ink)}.glb-tools input{display:none}.glb-status{position:absolute;top:48px;right:10px;z-index:5;max-width:70%;padding:5px 8px;border-radius:7px;background:rgba(8,10,16,.82);color:#d8dcef;font-size:.72rem;pointer-events:none}.v3h{position:absolute;left:12px;bottom:8px;font-size:.78rem;color:var(--muted);pointer-events:none}.sels{display:flex;gap:8px}
.ofilt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.ofilt input,.ofilt select{font:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}.ofilt input[type=search]{flex:1 1 180px}.ofilt input[type=number]{width:120px}.ofilt .chk{display:flex;align-items:center;gap:6px;font-size:.9rem;margin:0;font-weight:400}
.olist{margin-bottom:20px}.orow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}.orow.sel{background:var(--soft)}.orow .nm{font-weight:500}.orow.bad .nm{color:var(--muted)}.tg{color:var(--muted);font-size:.82rem}.ra{display:flex;align-items:center;gap:12px}.pr{font-family:"IBM Plex Mono",monospace;font-size:.92rem}.orow button{width:auto;padding:7px 14px;font-size:.9rem}.orow button[aria-pressed=true]{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.modes{margin-bottom:20px}.ownh{font-size:1.2rem;margin:0 0 16px;font-weight:600}
.ogrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:18px}
.osel{width:100%;font:inherit;font-size:.95rem;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.warns{list-style:none;padding:0;margin:0 0 18px}.warns li{padding:10px 12px;border-radius:9px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);margin-bottom:6px;font-size:.92rem}.warns li.good{background:var(--soft);color:var(--ok)}
@media (max-width:520px){tr{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--line)}td{border:0;padding:8px 2px}td:first-child{grid-column:1/3;width:auto;padding-bottom:0}}
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#07080c;--panel:#0f1117;--ink:#eceff7;--muted:#8a92a8;--line:#222636;--accent:#7c5cff;--accent-ink:#fff;--soft:rgba(124,92,255,.13);--ok:#4ade80;--warn:#ff7a7a;color-scheme:dark}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 520px at 85% -8%,rgba(124,92,255,.22),transparent 60%),radial-gradient(700px 420px at 0% 10%,rgba(34,211,238,.09),transparent 60%),var(--bg);background-attachment:fixed}
main{max-width:1280px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:-28px -16px 28px;padding:14px 16px;background:rgba(7,8,12,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{background:linear-gradient(135deg,#7c5cff,#22d3ee);border-radius:10px;box-shadow:0 0 24px rgba(124,92,255,.5)}.logo svg{stroke:#fff}
h1{background:linear-gradient(180deg,#fff,#aeb6ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;letter-spacing:-.03em;max-width:20ch;font-size:clamp(2rem,5vw,3.3rem)}
.panel,.oleft,.oright{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 40%),var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
button{background:linear-gradient(135deg,#7c5cff,#5b8cff);color:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(124,92,255,.35)}
button.ghost{background:transparent;color:var(--ink);box-shadow:none}
.lang,input[type=number],.osel,.ofilt input,.ofilt select,.opt{background:#0a0c12;border-color:var(--line);border-radius:12px}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
.tabs button{border-radius:99px;box-shadow:none;background:transparent;color:var(--ink)}.tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.modes{display:inline-flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.modes button{border:0;border-radius:10px;padding:9px 18px;color:var(--muted)}.modes button[aria-pressed=true]{background:linear-gradient(135deg,#7c5cff,#5b8cff);color:#fff;box-shadow:0 6px 20px rgba(124,92,255,.4)}
.pill{background:var(--soft);color:#c4b8ff}
.big{font-family:"JetBrains Mono",ui-monospace,monospace;background:linear-gradient(90deg,#fff,#b9a8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
td:last-child,.pr{font-family:"JetBrains Mono",ui-monospace,monospace}
.meter i{background:linear-gradient(90deg,#7c5cff,#22d3ee)}.meter.over i{background:var(--warn)}

.ogrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.orow{border-radius:12px;padding:10px 12px;border:1px solid transparent;border-top-color:var(--line)}.orow:hover{background:rgba(255,255,255,.03)}.orow.sel{border-color:var(--accent);background:var(--soft)}
.olist{max-height:560px;overflow:auto;margin-bottom:0}.warns li{border-radius:12px}

<body>
<main>
<div class="top"><div class="brand"><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/></svg></span>Smart PC Builder</div><span class="sels"><select id="ctry" class="lang"></select><select id="lang" class="lang"></select></span></div>
<h1 data-i18n="h1"></h1>
<p class="sub" data-i18n="sub"></p>

<div id="v-own" class="panel" hidden>
  <h2 class="ownh" data-i18n="ownh"></h2>
  <div class="view3d" id="v3o"></div>
  <div class="ogrid" id="ogrid"></div>
  <div class="ofilt" id="ofilt"></div>
  <div class="olist" id="olist" aria-live="polite"></div>
  <div class="load" id="oload"></div>
  <ul class="warns" id="owarn"></ul>
  <div class="lbl" data-i18n="total"></div><div class="big" id="ototal"></div>
  <p class="note" data-i18n="compat"></p>
  <p class="note" data-i18n="excl"></p>
  <p class="note" data-i18n="note"></p>
  <div class="actions"><button id="ocopy" class="ghost" type="button" data-i18n="copy"></button></div>
  <p class="note" id="ocopied" role="status"></p>
</div>
<div class="layout" id="v-adv">
<form class="panel ctl" id="form" novalidate>
  <label for="budget" data-i18n="budget"></label>
  <input id="budget" type="number" inputmode="decimal" step="any">
  <fieldset>
    <legend data-i18n="goal"></legend>
    <label class="opt"><input type="radio" name="goal" value="1" checked><span data-i18n="g1"></span></label>
    <label class="opt"><input type="radio" name="goal" value="2"><span data-i18n="g2"></span></label>
    <label class="opt"><input type="radio" name="goal" value="3"><span data-i18n="g3"></span></label>
  </fieldset>
  <fieldset>
    <legend data-i18n="res"></legend>
    <label class="opt"><input type="radio" name="res" value="1" checked><span>1080p</span></label>
    <label class="opt"><input type="radio" name="res" value="2"><span>1440p</span></label>
    <label class="opt"><input type="radio" name="res" value="3"><span>4K</span></label>
  </fieldset>
  <p class="err" id="err" role="alert"></p>
  <button id="go" type="submit" data-i18n="go"></button>
</form>
<section id="result" class="panel" hidden aria-live="polite">
  <div class="head"><div><div class="lbl" data-i18n="total"></div><div class="big" id="total"></div></div><span class="pill" id="cat"></span></div>
  <div class="view3d" id="v3a"></div>
  <div class="tabs" id="tabs" role="group"></div>
  <div class="meter" id="meter"><i id="bar"></i></div>
  <p class="status" id="status"></p>
  <table id="parts"></table>
  <p class="note" id="why"></p>
  <p class="note" id="up"></p>
  <p class="note" data-i18n="compat"></p>
  <p class="note" data-i18n="excl"></p>
  <p class="note" data-i18n="note"></p>
  <div class="actions"><button id="copy" class="ghost" type="button" data-i18n="copy"></button></div>
  <p class="note" id="copied" role="status"></p>
</section>
</div>
</main>
